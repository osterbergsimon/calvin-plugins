name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Calvin ref the plugins are tested against. CI pins the latest Calvin
  # release tag: bump it when Calvin cuts a new release. Switch to `develop`
  # only temporarily when plugins need unreleased host changes, and say so
  # in the PR.
  # Applies to every trigger (PRs and pushes to main/develop alike).
  CALVIN_REF: v0.1.0-rc.3

jobs:
  test-plugins:
    name: Test Plugins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    
    steps:
      - name: Checkout calvin-plugins
        uses: actions/checkout@v4
        with:
          path: calvin-plugins
      
      - name: Checkout calvin (for backend dependencies)
        uses: actions/checkout@v4
        with:
          repository: osterbergsimon/calvin
          path: calvin
          # See CALVIN_REF at the top of this file.
          ref: ${{ env.CALVIN_REF }}
      
      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install calvin backend dependencies
        working-directory: ./calvin/backend
        run: uv sync --extra dev
      
      - name: Run plugin tests
        working-directory: ./calvin/backend
        env:
          # Set PYTHONPATH to include calvin-plugins so plugins can be imported
          PYTHONPATH: ${{ github.workspace }}/calvin-plugins:${{ github.workspace }}/calvin/backend
        run: |
          # Run all plugin test files from the backend directory
          # pytest will discover and run all test_*.py files in calvin-plugins
          uv run pytest ../../calvin-plugins -v --tb=short
